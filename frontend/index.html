<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!--
      The tags between here and the end of the JSON-LD block are rewritten per
      route by `scripts/prerender.mjs` after the build, so a crawler that does
      not run JavaScript still gets route-specific metadata. Keep each on one
      line — the pre-renderer matches them by tag.
    -->
    <title>Nurella Beauty Lounge — Advanced Aesthetics, Skin &amp; Beauty</title>
    <meta name="description" content="Nurella Beauty Lounge offers facial aesthetics, collagen biostimulation, skin boosters, advanced skin treatments, laser, permanent makeup, facials and nails. Every treatment begins with a personalized consultation — request an appointment online." />
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nurella Beauty Lounge" />
    <meta property="og:title" content="Nurella Beauty Lounge — Advanced Aesthetics, Skin &amp; Beauty" />
    <meta property="og:description" content="Facial aesthetics, collagen biostimulation, skin boosters, advanced skin treatments, laser, permanent makeup, facials and nails — every treatment planned around you." />
    <meta property="og:image" content="%VITE_SITE_URL%/images/og-cover.svg" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA -->
    <meta name="theme-color" content="#241d18" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nurella" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300&family=Jost:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!--
      Development / fallback graph only. The build replaces this with the full
      per-route graph (business, website, services, FAQ, breadcrumbs) built from
      `src/content/geo/*` — see scripts/prerender.mjs. At runtime the React app
      renders the same graph through `components/ui/JsonLd`.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BeautySalon",
        "name": "Nurella Beauty Lounge",
        "description": "Advanced Aesthetics • Skin • Beauty",
        "url": "%VITE_SITE_URL%/",
        "sameAs": ["https://instagram.com/nurella_beauty_lounge"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Nurella Beauty Lounge requires JavaScript. Please enable it to view our treatments and book an
      appointment.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
